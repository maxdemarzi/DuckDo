# Descriptor for submission to duckdb/community-extensions.
#
# Copy this file to extensions/duckdo/description.yml in a fork of that repo and
# open a PR. Update `version` and `ref` to the release commit first - `ref` must
# be a full SHA, not a branch.
#
# excluded_platforms is deliberately empty: DuckDo has no external dependencies,
# so there is no known reason any target should fail. The community CI builds
# every platform; add exclusions only for the ones it actually reports failing,
# rather than pre-emptively.

extension:
  name: duckdo
  description: Causal inference inside DuckDB - average and conditional treatment effects, assumption diagnostics, refutation tests, DAG-based identification and interventional do() queries, all in SQL with no Python and no model downloads
  version: '2026.09.09'
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - maxdemarzi

repo:
  github: maxdemarzi/DuckDo
  ref: 0000000000000000000000000000000000000000

docs:
  hello_world: |
    -- No downloads, no network, no Python. A tiny randomised experiment:
    -- treatment is assigned by coin flip, so the true effect is exactly 2.0.
    CREATE TABLE trial AS
    SELECT i AS user_id,
           (i % 2) AS nudged,
           (i % 7) * 1.0 AS tenure,
           10.0 + 0.5 * (i % 7) + 2.0 * (i % 2) + ((i * 37) % 11) * 0.1 AS minutes
    FROM range(2000) t(i);

    -- Every result names its estimand, its estimator and how the interval was made.
    SELECT estimand, estimator, round(estimate, 3) AS estimate,
           round(ci_low, 3) AS ci_low, round(ci_high, 3) AS ci_high, variance_method
    FROM do_ate('trial', treatment := 'nudged', outcome := 'minutes',
                covariates := ['tenure']);
    -- ATE | aipw | 2.000 | 1.972 | 2.027 | influence function

    -- Then check the assumptions behind that number. Every diagnostic returns
    -- rows with a verdict, so it drops straight into a dbt test.
    SELECT check_name, status, severity, detail
    FROM do_diagnose('trial', treatment := 'nudged', outcome := 'minutes',
                     covariates := ['tenure']);

  extended_description: |
    **DuckDo** answers the question SQL cannot: not *what happened*, but **what
    would happen if I did X**. `SELECT` reports the past; `do_ate()` reports what
    your last change was worth; `do_predict(intervention := ...)` reports what the
    next one would be worth.

    Everything runs in-process. There are no model weights to download, no Python
    runtime, no network calls, and no telemetry - which matters, because causal
    analysis tends to run on exactly the data you cannot send anywhere.

    ### Estimation

    ```sql
    SELECT * FROM do_ate('customers',
        treatment  := 'received_discount',
        outcome    := 'revenue',
        covariates := ['age', 'income', 'tenure'],
        estimator  := 'aipw');
    ```

    Nine estimators behind `estimator :=` - `aipw` (doubly robust, the default),
    `dml` (cross-fitted partially linear), `ipw` (Hajek), `regression`
    (g-computation), `naive`, and the `s_learner` / `t_learner` / `x_learner` /
    `dr_learner` meta-learners. Propensity and outcome models are cross-fitted
    5-fold with a seeded, stratified split, so a query returns the same number
    twice. `do_att` and `do_atc` target the treated and the untreated;
    `do_cate` returns a per-row effect with a pointwise interval; `do_ate_by`
    estimates one effect per segment.

    Every result carries `estimand`, `estimator`, `variance_method`, `n`,
    `n_treated`, `n_trimmed` and a `warnings` list. No result is a bare number.

    ### Assumptions you can query

    This is what separates causal inference from prediction, so it is not
    relegated to the documentation:

    ```sql
    SELECT * FROM do_balance(...);       -- standardised differences, raw vs weighted
    SELECT * FROM do_overlap(...);       -- propensity support, off-support buckets
    SELECT * FROM do_diagnose(...);      -- the whole battery, with severities
    SELECT * FROM do_refute(..., method := 'placebo_treatment');
    SELECT * FROM do_sensitivity(...);   -- E-value and Cinelli-Hazlett robustness value
    ```

    Five refutation methods: `placebo_treatment`, `random_common_cause`, `subset`,
    `bootstrap`, `unobserved_confounder`. Each returns the original estimate, the
    refuted estimate and a boolean `passed`.

    ### Graphs: what should I even adjust for?

    ```sql
    CALL do_graph_create('sales_dag', 'digraph {
      intent [latent];
      season -> discount; season -> revenue;
      discount -> clicks; clicks -> revenue;
      intent -> discount; intent -> revenue;
      coupon_mail -> discount;
    }');

    SELECT strategy, identifiable, adjustment_set
    FROM do_identify(graph := 'sales_dag', treatment := 'discount', outcome := 'revenue');
    -- backdoor  | false | []             -- names 'intent' as the unobserved cause
    -- frontdoor | true  | [clicks]
    -- iv        | true  | [coupon_mail]

    SELECT covariate, role, verdict
    FROM do_validate(graph := 'sales_dag', treatment := 'discount', outcome := 'revenue',
                     covariates := ['season', 'clicks', 'coupon_mail']);
    -- season      | confounder | keep
    -- clicks      | mediator   | DROP   -- adjusting removes part of the effect
    -- coupon_mail | instrument | DROP   -- reaches the outcome only through the treatment
    ```

    `do_validate` will prevent more wrong answers than any estimator here.
    `do_dseparated` exposes the underlying primitive directly. Graphs are stored
    in a `duckdo_graphs` table, so they survive a restart and can be inspected
    like any other data.

    When the backdoor is blocked, the strategies `do_identify` recommends are
    estimable rather than merely named: `do_iv` runs 2SLS and reports the
    first-stage F so a weak instrument is visible instead of silently ruinous,
    and `do_frontdoor` applies the product formula and reports each half
    separately.

    `do_mediate` asks the other question - how much of an already-identified
    effect travels *through* the mediator - and returns the natural direct and
    indirect effects with the treatment-mediator interaction carried. Omitting
    that interaction leaves the total effect correct while getting the split
    wrong by a third, which is the failure that survives a sanity check. The
    proportion mediated is refused rather than reported when the total effect
    straddles zero.

    ### Beyond the cross-section

    ```sql
    SELECT * FROM do_ape(...);            -- average partial effect, continuous treatment
    SELECT * FROM do_ate_levels(...);     -- three or more arms, each against a reference
    SELECT * FROM do_ate_pool(...);       -- sites estimated apart, pooled without their rows
    SELECT * FROM do_dose_response(...);  -- the curve, on a quantile grid
    SELECT * FROM do_did(...);            -- Callaway-Sant'Anna group-time effects
    SELECT * FROM do_event_study(...);    -- the pre-trend check
    SELECT * FROM do_synth(...);          -- synthetic control, placebo p-value
    SELECT * FROM do_discover_dot(...);   -- a proposed graph, refused until reviewed
    SELECT * FROM do_msm(...);            -- time-varying treatment, stabilised IPTW
    SELECT * FROM do_rmst(...);           -- time-to-event, without a hazard ratio
    ```

    Two-way fixed effects is deliberately absent: it misweights under staggered
    adoption. `do_msm` handles the case that has no correct adjustment set at all
    - a confounder the treatment itself affects - where adjusting for everything
    measured gives 3.47 against a truth of 2.0 and the marginal structural model
    gives 2.13. `do_rmst` returns a difference in restricted mean survival time
    rather than a hazard ratio, which is not a causal quantity because the risk
    sets stop being comparable the moment the treatment works.

    ### Interventions and policies

    ```sql
    SELECT * FROM do_predict('customers', treatment := 'discount', outcome := 'revenue',
                             intervention := {'price': 19.99});
    SELECT * FROM do_counterfactual(...);    -- per-row y0, y1 and the effect
    SELECT * FROM do_policy_value(..., policy := 'my_targeting_rule');
    SELECT * FROM do_uplift(...);            -- Qini curve rows, ready to plot
    SELECT * FROM do_optimal_policy(...);    -- a shallow, deployable rule
    ```

    ### Verified, not asserted

    Against EconML and DoWhy on identical rows, including the standard IHDP
    replication:

    | scenario | truth | duckdo aipw | econml DRLearner | dowhy PSW |
    |---|---|---|---|---|
    | linear confounded | 3.0000 | 3.0193 | 3.0180 | 3.0337 |
    | heterogeneous | 2.9936 | 2.9847 | 2.9716 | 2.9662 |
    | IHDP npci-1 | 4.0161 | 3.8766 | 3.9555 | 4.0287 |

    Across all ten IHDP replications available from the CEVAE mirror, mean
    absolute ATE error is 0.137 for `aipw` and 0.147 for econml's `LinearDML`.
    On Lalonde NSW, where treatment was randomised so the unadjusted difference
    *is* the effect, every method lands within 13% of the 1794.3 benchmark.

    Reproduce with `scripts/crosscheck_econml.py` and
    `scripts/bench_headtohead.py`.

    ### Limits, stated plainly

    Binary treatments for the effect estimators; continuous ones go through
    `do_ape` and `do_dose_response`, and a dose passed to the binary path is
    refused rather than silently binarised. Treatments with more than two
    levels go through `do_ate_levels`, which contrasts each against a reference
    over the whole population. Base learners are regularised GLMs, so strongly non-linear
    confounding will not be fully removed. `do_cate` interval coverage measures
    0.948, 0.948 and 0.944 - each within its own standard error of the nominal
    0.95 - across randomised, confounded and strongly-confounded DGPs.

    ### Causal foundation models

    `model := 'causalpfn'` runs
    [CausalPFN](https://github.com/vdblm/CausalPFN) - an 18.8M parameter
    transformer pretrained on synthetic structural causal models - inside DuckDB
    on ONNX Runtime, behind the same SQL as the classical estimators.
    [Do-PFN](https://github.com/jr2021/Do-PFN) is available too.

    That path is **opt-in at build time** (`-DDUCKDO_WITH_ONNX=ON`), which is
    why this community build does not carry it: keeping the default build
    dependency-free is what lets the example above run with no download at all.
    The extension never ships or redistributes weights - you export the graphs
    yourself from the upstream checkpoint with `scripts/export/export_dopfn.py`,
    which refuses to finish unless every graph reproduces PyTorch to within 1e-4.

    On a linear DGP CausalPFN matches AIPW and cannot do better: 3.0610 beside
    3.0628 against a truth of 2.9806. On IHDP, where the covariate structure is
    real and nobody specified it in advance, it wins decisively - mean PEHE
    0.416 against 2.161 for the best classical method measured, a factor of five
    on per-row effects. Do-PFN ranks individuals well but shrinks the population
    average, the documented weakness of that model class, reproduced rather than
    hidden, and its five-covariate budget is disqualifying on a real table.
    Start with CausalPFN.

    Every function is registered twice: the short `do_*` name and the
    unambiguous `duckdo_*` full name.
