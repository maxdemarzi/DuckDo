#
# Builds the documentation site from README.md and docs/ with MkDocs, failing on
# any broken link, and publishes it with GitHub Pages. Publishing needs Pages
# enabled once in the repository settings, with "GitHub Actions" as the source.
#
name: Documentation site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/Docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # MkDocs 2.0 removes the plugin and theme systems this site depends on, with
      # no migration path, so the site stays on 1.x until that changes.
      - name: Install MkDocs
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"
      - name: Build, failing on any broken link
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
